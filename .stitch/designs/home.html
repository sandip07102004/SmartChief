</div>
<button class="surface-card rounded-xl p-3 flex items-center justify-center hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="tune">tune</span>
</button>
</section>
<!-- Categories -->
<section class="flex gap-3 overflow-x-auto hide-scrollbar pb-1 -mx-container-padding px-container-padding">
<button class="bg-[#FF6B35] text-white px-5 py-2 rounded-full font-label-caps text-label-caps whitespace-nowrap">ALL</button>
<button class="surface-card px-5 py-2 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap">BREAKFAST</button>

<button class="surface-card px-5 py-2 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap">DESSERTS</button>
