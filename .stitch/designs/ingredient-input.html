<!DOCTYPE html>

<style>
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(42, 28, 24, 0.9) 0%, rgba(38, 24, 20, 0.95) 100%);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen relative pb-40 font-body-lg text-body-lg antialiased">
<!-- TopAppBar JSON Component -->
<header class="fixed top-0 w-full z-50 border-b border-white/10 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl flex items-center justify-between px-container-padding h-16 transition-all duration-300">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">CookSmart</span>
</div>
<div>
<!-- Trailing slot empty as per JSON -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-container-padding flex flex-col gap-stack-gap-lg">
<!-- Page Header -->
<div class="flex items-end justify-between">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background leading-tight">What's in your<br/>pantry?</h1>
<button class="font-label-caps text-label-caps text-outline hover:text-primary transition-colors uppercase tracking-wider mb-2">Clear all</button>
</div>
<!-- Search Input -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">search</span>
</div>
<input class="w-full h-14 bg-surface-container border border-outline/20 rounded-xl pl-12 pr-16 text-body-lg text-on-background placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-inner" placeholder="Add ingredient (e.g., Chicken, Garlic)..." type="text"/>
<button class="absolute inset-y-1.5 right-1.5 w-11 bg-primary-container text-on-primary-container rounded-lg flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-md">
<span class="material-symbols-outlined font-bold text-[24px]">add</span>
</button>
</div>
<!-- Selected Ingredients Card (Glassmorphism/Tactile) -->
<section class="glass-card border border-outline/20 rounded-[20px] p-5 relative overflow-hidden">
<!-- Decorative subtle glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex items-center justify-between mb-4 relative z-10">
<h2 class="font-title-md text-title-md text-on-surface">Your Selected Ingredients</h2>
<span class="bg-primary/10 border border-primary/20 text-primary font-label-caps text-label-caps px-2.5 py-1 rounded-full uppercase tracking-wider">
                    4 items added
                </span>
</div>
<div class="flex flex-wrap gap-2.5 relative z-10">
<!-- Tag: Chicken Breast -->
<div class="flex items-center gap-1.5 bg-surface-variant/80 border border-outline-variant rounded-full pl-3.5 pr-1.5 py-1.5 hover:bg-surface-variant transition-colors group cursor-default">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Chicken Breast</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-surface-bright text-outline hover:text-error transition-all active:scale-90">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Tag: Garlic -->
<div class="flex items-center gap-1.5 bg-surface-variant/80 border border-outline-variant rounded-full pl-3.5 pr-1.5 py-1.5 hover:bg-surface-variant transition-colors group cursor-default">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Garlic</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-surface-bright text-outline hover:text-error transition-all active:scale-90">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Tag: Baby Spinach -->
<div class="flex items-center gap-1.5 bg-surface-variant/80 border border-outline-variant rounded-full pl-3.5 pr-1.5 py-1.5 hover:bg-surface-variant transition-colors group cursor-default">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Baby Spinach</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-surface-bright text-outline hover:text-error transition-all active:scale-90">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Tag: Olive Oil -->
<div class="flex items-center gap-1.5 bg-surface-variant/80 border border-outline-variant rounded-full pl-3.5 pr-1.5 py-1.5 hover:bg-surface-variant transition-colors group cursor-default">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Olive Oil</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-surface-bright text-outline hover:text-error transition-all active:scale-90">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</section>
<!-- Quick Add Staples -->
<section class="flex flex-col gap-4">
<h3 class="font-title-md text-title-md text-on-surface">Quick Add Staples</h3>
<div class="flex flex-wrap gap-2.5">
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Eggs
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Rice
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Tomatoes
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Onion
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Parmesan
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Lemon
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Pasta
                </button>
<button class="font-body-sm text-body-sm px-4 py-2 rounded-full border border-outline/30 bg-transparent text-outline hover:bg-surface-variant hover:text-on-surface hover:border-outline-variant active:scale-95 transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> Bell Pepper
                </button>
</div>
</section>
<!-- Meal Preferences -->
<section class="flex flex-col gap-4 mb-8">
<h3 class="font-title-md text-title-md text-on-surface">Meal Preferences</h3>
<div class="flex flex-wrap gap-2.5">
<button class="font-label-caps text-label-caps uppercase tracking-wider px-4 py-2.5 rounded-xl border border-outline/20 bg-surface-container text-outline hover:bg-surface-variant transition-all active:scale-95">Under 30 Mins</button>
<button class="font-label-caps text-label-caps uppercase tracking-wider px-4 py-2.5 rounded-xl border border-primary/50 bg-primary/10 text-primary transition-all active:scale-95 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span> High Protein
                </button>
<button class="font-label-caps text-label-caps uppercase tracking-wider px-4 py-2.5 rounded-xl border border-outline/20 bg-surface-container text-outline hover:bg-surface-variant transition-all active:scale-95">Vegetarian</button>
<button class="font-label-caps text-label-caps uppercase tracking-wider px-4 py-2.5 rounded-xl border border-outline/20 bg-surface-container text-outline hover:bg-surface-variant transition-all active:scale-95">Low Carb</button>
</div>
</section>
</main>
<!-- Floating Action Button (FAB) -->
<div class="fixed bottom-[96px] left-0 w-full px-container-padding z-40">
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-full font-title-md text-title-md shadow-[0_8px_32px_-8px_rgba(255,107,53,0.6)] hover:bg-primary-container/90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">magic_button</span>
            GENERATE RECIPE (4)
        </button>
</div>
<!-- BottomNavBar JSON Component -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl border-t border-white/10 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl flex justify-around items-center h-20 px-4 pb-safe">
<!-- Tab: Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<!-- Tab: Ingredients (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:text-primary transition-colors active:scale-90 transition-transform w-24" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">kitchen</span>
<span class="font-label-caps text-label-caps">Ingredients</span>
</a>
<!-- Tab: Saved (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">bookmark</span>
<span class="font-label-caps text-label-caps">Saved</span>
</a>
</nav>
<!-- Safe area padding for iOS -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</body></html>
